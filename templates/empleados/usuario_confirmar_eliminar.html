{% extends "base.html" %}
{% block titulo %}Eliminar usuario | Nómina{% endblock %}
{% block contenido %}
<section class="panel panel-centrado">
    <h1>Eliminar usuario</h1>
    <p>¿Estás seguro de que deseas eliminar al usuario <strong>{{ usuario.username }}</strong>?</p>
    <p class="texto-peligro">Esta acción no se puede deshacer.</p>
    <form method="post" class="acciones-form">
        {% csrf_token %}
        <button type="submit" class="btn btn-peligro">Sí, eliminar</button>
        <a href="{% url 'usuario_lista' %}" class="btn btn-secundario">Cancelar</a>
    </form>
</section>
{% endblock %}
