{% extends "base.html" %}
{% block titulo %}Eliminar empleado | Nómina{% endblock %}
{% block contenido %}
<section class="panel panel-centrado">
    <h1>Eliminar empleado</h1>
    <p>¿Estás seguro de que deseas eliminar a <strong>{{ object.nombre_completo }}</strong> ({{ object.cedula }})?</p>
    <p class="texto-peligro">Esta acción no se puede deshacer.</p>
    <form method="post" class="acciones-form">
        {% csrf_token %}
        <button type="submit" class="btn btn-peligro">Sí, eliminar</button>
        <a href="{% url 'empleado_detalle' object.pk %}" class="btn btn-secundario">Cancelar</a>
    </form>
</section>
{% endblock %}
